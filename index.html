<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eclipse Parfums</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #08080a;
            --card-bg: #121216;
            --gold-light: #fff2b2;
            --gold-primary: #e6ca65;
            --gold-secondary: #b8860b;
            --border-gold: rgba(212, 175, 55, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: #f0f0f2;
            min-height: 100vh;
            padding-bottom: 110px;
        }

        .dev-credit {
            position: absolute;
            top: 12px;
            left: 15px;
            font-size: 0.65rem;
            color: var(--gold-light);
            opacity: 0.7;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-weight: 500;
        }

        header {
            text-align: center;
            padding: 55px 20px 25px;
            background: linear-gradient(to bottom, #16161c, var(--bg-color));
            border-bottom: 1px solid var(--border-gold);
            position: relative;
        }

        h1 {
            font-family: 'Great Vibes', cursive;
            font-size: 3rem;
            font-weight: 400;
            line-height: 1.2;
            margin: 0 0 8px 0;
            background: linear-gradient(135deg, #fffae0 0%, #ffdf6d 40%, #e6ca65 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(255, 223, 109, 0.4);
        }

        .subtitle {
            font-size: 0.75rem;
            color: var(--gold-light);
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 600;
            opacity: 0.95;
        }

        .filters {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 6px;
            padding: 15px 10px;
        }

        .filter-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-gold);
            color: #9ba1a6;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        .filter-btn.active {
            background: linear-gradient(135deg, var(--gold-primary), var(--gold-secondary));
            color: #000;
            border-color: var(--gold-light);
            font-weight: 700;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.4);
        }

        .catalog {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 16px;
            padding: 15px 15px 30px 15px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--border-gold);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6);
        }

        .image-container {
            width: 100%;
            height: 190px;
            background-color: #fff;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
        }

        .image-container img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            transition: transform 0.5s ease;
        }

        .card:hover .image-container img {
            transform: scale(1.08);
        }

        .badge-gender {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(8, 8, 10, 0.85);
            border: 1px solid var(--border-gold);
            color: var(--gold-light);
            font-size: 0.62rem;
            padding: 3px 8px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
            backdrop-filter: blur(5px);
            z-index: 2;
        }

        .card-content {
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex-grow: 1;
        }

        .brand-name {
            font-size: 0.62rem;
            color: var(--gold-light);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 600;
            opacity: 0.75;
        }

        .perfume-name {
            font-size: 1.05rem;
            font-weight: 700;
            color: #ffffff;
            line-height: 1.2;
        }

        .usage-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(212, 175, 55, 0.1);
            border: 1px solid rgba(212, 175, 55, 0.2);
            padding: 4px 8px;
            border-radius: 8px;
            font-size: 0.7rem;
            color: var(--gold-light);
            width: fit-content;
            font-weight: 600;
            text-transform: uppercase;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 14px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            background: rgba(0, 0, 0, 0.2);
        }

        .price {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--gold-light);
        }

        .cart
